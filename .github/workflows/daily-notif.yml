name: Daily Notification

on:
  schedule:
    - cron: '0 * * * *'  # every hour UTC — checks if notif already sent today
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notifications
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          node << 'EOF'
          const https = require('https');

          async function request(method, url, headers, body) {
            return new Promise((res, rej) => {
              const data = body ? JSON.stringify(body) : null;
              const u = new URL(url);
              const opts = {
                hostname: u.hostname, path: u.pathname+u.search, method,
                headers: { ...headers, ...(data ? {'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)} : {}) }
              };
              const req = https.request(opts, r => {
                let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{res(JSON.parse(d))}catch{res(d)} });
              });
              req.on('error',rej);
              if(data) req.write(data);
              req.end();
            });
          }

          (async()=>{
            const gistId  = process.env.GIST_ID;
            const gistPat = process.env.GIST_PAT;
            const osAppId = process.env.ONESIGNAL_APP_ID;
            const osKey   = process.env.ONESIGNAL_REST_KEY;
            const ghHeaders = { 'Authorization':`Bearer ${gistPat}`, 'Accept':'application/vnd.github+json', 'User-Agent':'alteco-notif' };

            // Load Gist
            const gist = await request('GET', `https://api.github.com/gists/${gistId}`, ghHeaders);
            const content = gist.files?.['alteco-data.json']?.content;
            if(!content) { console.log('No data'); process.exit(0); }
            const db = JSON.parse(content);

            // Push enabled?
            if(!db.settings?.pushNotifEnabled) { console.log('Push disabled'); process.exit(0); }

            // Dedup: skip if already sent today (WIB)
            const now   = new Date(new Date().toLocaleString('en-US', {timeZone:'Asia/Jakarta'}));
            const today = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Jakarta'}); // YYYY-MM-DD
            if(db.settings.notifSentDate === today) { console.log('Already sent today, skip'); process.exit(0); }

            // Get matching events
            const dow = now.getDay();
            const dom = now.getDate();
            const events = (db.events||[]).filter(ev => {
              if(ev.type==='once') return ev.date && ev.date >= today;
              if(ev.type==='recurring'){
                if(ev.recurrence==='harian') return true;
                const base = ev.recurDate ? new Date(ev.recurDate+'T00:00:00') : null;
                if(ev.recurrence==='mingguan') return base ? dow===base.getDay() : dow===1;
                if(ev.recurrence==='bulanan')  return base ? dom===base.getDate() : dom===1;
                if(ev.recurrence==='tahunan')  return base ? (now.getMonth()===base.getMonth()&&dom===base.getDate()) : false;
              }
              return false;
            });

            if(!events.length) { console.log('No matching events today'); process.exit(0); }

            // Send pushes
            for(const ev of events){
              const body = ev.type==='once' && ev.date===today ? 'Event hari ini!' :
                           ev.type==='once' ? `${Math.round((new Date(ev.date)-new Date(today))/86400000)} hari lagi` :
                           'Event berulang hari ini';
              await request('POST', 'https://onesignal.com/api/v1/notifications',
                { 'Authorization':`Key ${osKey}` },
                { app_id:osAppId, included_segments:['All'],
                  headings:{en:'📌 Alteco — '+ev.title},
                  contents:{en: ev.desc||body},
                  url:'https://dionisiusnp.github.io/todolist/' }
              );
              console.log('Sent:', ev.title);
            }

            // Mark sent today — save back to Gist
            db.settings.notifSentDate = today;
            await request('PATCH', `https://api.github.com/gists/${gistId}`, ghHeaders,
              { files: { 'alteco-data.json': { content: JSON.stringify(db) } } }
            );
            console.log('Done, marked sent for', today);
          })();
          EOF
