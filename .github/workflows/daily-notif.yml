name: Daily Notification

on:
  schedule:
    - cron: '0 * * * *'  # every hour UTC
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notifications
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          node << 'EOF'
          const https = require('https');

          async function get(url, headers={}) {
            return new Promise((res, rej) => {
              https.get(url, {headers}, r => {
                let d=''; r.on('data',c=>d+=c); r.on('end',()=>res(JSON.parse(d)));
              }).on('error',rej);
            });
          }

          async function post(url, headers, body) {
            return new Promise((res, rej) => {
              const data = JSON.stringify(body);
              const u = new URL(url);
              const req = https.request({ hostname:u.hostname, path:u.pathname, method:'POST',
                headers:{...headers,'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)}
              }, r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>res(JSON.parse(d))); });
              req.on('error',rej); req.write(data); req.end();
            });
          }

          (async()=>{
            const gistId = process.env.GIST_ID;
            const gistPat = process.env.GIST_PAT;
            const osAppId = process.env.ONESIGNAL_APP_ID;
            const osKey = process.env.ONESIGNAL_REST_KEY;

            // Load Gist data
            const gist = await get(`https://api.github.com/gists/${gistId}`, {
              'Authorization': `Bearer ${gistPat}`,
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'alteco-notif'
            });
            const content = gist.files?.['alteco-data.json']?.content;
            if(!content) { console.log('No data'); process.exit(0); }
            const db = JSON.parse(content);

            // Check if push enabled
            if(!db.settings?.pushNotifEnabled) { console.log('Push disabled'); process.exit(0); }

            // Check if current time matches notifTime (Asia/Jakarta)
            const notifTime = db.settings.notifTime || '07:00';
            const [notifH, notifM] = notifTime.split(':').map(Number);
            const now = new Date(new Date().toLocaleString('en-US', {timeZone:'Asia/Jakarta'}));
            if(now.getHours() !== notifH) { console.log('Not notif time, skip'); process.exit(0); }

            // Get today's events
            const today = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Jakarta'}); // YYYY-MM-DD
            const dayOfWeek = now.getDay();
            const dateOfMonth = now.getDate();

            const events = (db.events||[]).filter(ev => {
              if(ev.type==='once') return ev.date && ev.date >= today; // tiap hari s.d. hari H
              if(ev.type==='recurring'){
                if(ev.recurrence==='harian') return true;
                // berulang: hanya pada hari H sesuai recurDate
                const base = ev.recurDate ? new Date(ev.recurDate+'T00:00:00') : null;
                if(ev.recurrence==='mingguan')
                  return base ? dayOfWeek===base.getDay() : dayOfWeek===1;
                if(ev.recurrence==='bulanan')
                  return base ? dateOfMonth===base.getDate() : dateOfMonth===1;
                if(ev.recurrence==='tahunan')
                  return base ? (now.getMonth()===base.getMonth()&&dateOfMonth===base.getDate()) : false;
              }
              return false;
            });

            if(!events.length) { console.log('No events today'); process.exit(0); }

            // Send one push per event
            for(const ev of events){
              const body = ev.type==='once' && ev.date===today ? 'Event hari ini!' :
                           ev.type==='once' ? `${Math.round((new Date(ev.date)-new Date(today))/86400000)} hari lagi` :
                           'Event berulang hari ini';
              await post('https://onesignal.com/api/v1/notifications', {
                'Authorization': `Key ${osKey}`
              }, {
                app_id: osAppId,
                included_segments: ['All'],
                headings: { en: '📌 Alteco — '+ev.title },
                contents: { en: ev.desc || body },
                url: 'https://dionisiusnp.github.io/todolist/'
              });
              console.log('Sent:', ev.title);
            }
          })();
          EOF
