<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Script Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--surface:#0f0f18;--bd:rgba(255,255,255,.08);
  --text:#e2e2ee;--muted:#8888aa;--accent:#6366f1;
  --font-sans:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r-sm:7px;--r-md:10px;--r-lg:14px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}

#dion-nav{
  position:sticky;top:0;z-index:99;
  display:flex;align-items:center;gap:10px;
  padding:9px 24px;
  background:rgba(9,9,15,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);font-size:.72rem;
}
#dion-nav a.back{
  display:flex;align-items:center;gap:6px;font-weight:600;
  color:var(--muted);padding:4px 11px;border-radius:var(--r-sm);
  border:1px solid var(--bd);text-decoration:none;
  transition:color .18s,border-color .18s;
}
#dion-nav a.back:hover{color:var(--accent);border-color:rgba(99,102,241,.3)}
.nav-title{color:rgba(255,255,255,.25);font-family:var(--font-mono);font-size:.68rem}

#content{max-width:780px;margin:0 auto;padding:2.5rem 1.5rem 4rem}

/* ── Markdown styles ── */
#md h1{font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1.2rem;line-height:1.25}
#md h2{font-size:1.1rem;font-weight:700;color:#fff;margin:2rem 0 .7rem;
  padding-bottom:.4rem;border-bottom:1px solid var(--bd)}
#md h3{font-size:.95rem;font-weight:600;color:rgba(255,255,255,.85);margin:1.4rem 0 .5rem}
#md h4{font-size:.85rem;font-weight:600;color:var(--muted);margin:1rem 0 .4rem;text-transform:uppercase;letter-spacing:.06em}
#md p{font-size:.85rem;color:rgba(255,255,255,.62);line-height:1.75;margin-bottom:.75rem}
#md ul,#md ol{padding-left:1.3rem;margin-bottom:.75rem}
#md li{font-size:.85rem;color:rgba(255,255,255,.62);line-height:1.7;margin-bottom:.2rem}
#md li strong{color:rgba(255,255,255,.85)}
#md strong{color:rgba(255,255,255,.88);font-weight:600}
#md em{color:rgba(255,255,255,.55);font-style:italic}
#md a{color:#6366f1;text-decoration:underline;text-underline-offset:3px}
#md a:hover{color:#818cf8}
#md code{
  font-family:var(--font-mono);font-size:.8rem;
  background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.18);
  padding:1px 6px;border-radius:4px;color:#a5b4fc;
}
#md pre{
  background:#0d0d1a;border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:1.1rem 1.2rem;margin:.8rem 0 1rem;overflow-x:auto;
}
#md pre code{
  background:none;border:none;padding:0;color:#c7d2fe;font-size:.78rem;line-height:1.65;
}
#md blockquote{
  border-left:3px solid var(--accent);padding:.5rem .9rem;
  background:rgba(99,102,241,.06);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin:.75rem 0;color:rgba(255,255,255,.55);font-size:.83rem;
}
#md hr{border:none;border-top:1px solid var(--bd);margin:1.5rem 0}
#md table{width:100%;border-collapse:collapse;margin:.75rem 0;font-size:.8rem}
#md th{background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font-weight:600;
  padding:.5rem .75rem;border:1px solid var(--bd);text-align:left}
#md td{padding:.45rem .75rem;border:1px solid var(--bd);color:rgba(255,255,255,.55)}

#loading{text-align:center;padding:4rem 0;color:var(--muted);font-size:.85rem;font-family:var(--font-mono)}
#error{text-align:center;padding:4rem 0;color:#f87171;font-size:.85rem}
</style>
</head>
<body>

<div id="dion-nav">
  <a href="/" class="back">
    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 12H5m7-7l-7 7 7 7"/></svg>
    Beranda
  </a>
  <span class="nav-title" id="nav-title">/ Script</span>
</div>

<div id="content">
  <div id="loading">memuat script...</div>
  <div id="md"></div>
  <div id="error" style="display:none"></div>
</div>

<script>
const SCRIPTS = {
  kemendikdasmen: { label:'Kemendikdasmen — Data Sekolah',    path:'kemendikdasmen/script.md' },
  btnproperti:    { label:'BTN Properti — Developer List',    path:'btnproperti/script.md'    },
  sisparnas:      { label:'SISPARNAS — DTW',                  path:'sisparnas/script.md'      },
  whatsappgroup:  { label:'WhatsApp Group — Crawling Safety', path:'whatsappgroup/script.md'  },
};

const params = new URLSearchParams(location.search);
const key    = params.get('s');
const meta   = SCRIPTS[key];

if (!meta) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display   = 'block';
  document.getElementById('error').textContent = 'Script tidak ditemukan.';
} else {
  document.title = meta.label + ' — Script Viewer';
  document.getElementById('nav-title').textContent = '/ ' + meta.label;

  fetch(meta.path)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('md').innerHTML = marked.parse(md);
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display   = 'block';
      document.getElementById('error').textContent = 'Gagal memuat file script.md';
    });
}
</script>
</body>
</html>
